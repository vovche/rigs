app-id: io.github.vovche.Rigs
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: rigs

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: rigs
    buildsystem: meson
    sources:
      - type: dir
        path: .
