name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            libsoup-3.0-dev \
            gettext \
            appstream

      - name: Configure Meson
        run: meson setup build -Dprefix=/usr

      - name: Compile Rigs
        run: meson compile -C build

      - name: Run Test Suite
        run: meson test -C build --verbose
